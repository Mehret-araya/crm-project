services:
  - type: web
    name: crm-project-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    healthCheckPath: /api/readyz
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: FRONTEND_ORIGIN
        value: https://crm-project-frontend.onrender.com

  - type: web
    name: crm-project-frontend
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/crm build
    staticPublishPath: artifacts/crm/dist/public
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: BASE_PATH
        value: /
      - key: VITE_API_URL
        fromService:
          name: crm-project-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
